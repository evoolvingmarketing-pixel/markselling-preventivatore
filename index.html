<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>MarkSelling™ — Preventivatore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --violet:#824DEB;
      --gold:#B89B56;
      --bg:#05030A;
      --card:rgba(12,10,18,.78);
      --line:rgba(255,255,255,.10);
      --text:#ffffff;
      --muted:rgba(255,255,255,.72);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:Poppins,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 600px at 20% 10%, rgba(130,77,235,.22), rgba(0,0,0,0) 60%),
        radial-gradient(900px 520px at 90% 30%, rgba(184,155,86,.18), rgba(0,0,0,0) 55%),
        linear-gradient(180deg, #05030A 0%, #020108 100%);
      padding:28px 16px;
    }
    .wrap{max-width:1100px;margin:0 auto}
    .card{
      border-radius:22px;
      background:linear-gradient(180deg, rgba(18,14,28,.86), rgba(10,8,16,.86));
      border:1px solid var(--line);
      box-shadow:0 18px 60px rgba(0,0,0,.55);
      overflow:hidden;
    }
    .head{
      padding:22px 24px 16px;
      border-bottom:1px solid rgba(255,255,255,.08);
      display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;
    }
    h1{margin:0;font-weight:900;font-size:22px;line-height:1.2}
    .sub{margin-top:8px;color:var(--muted);font-size:14px;line-height:1.55;max-width:760px}
    .badge{
      display:inline-flex;align-items:center;gap:10px;
      padding:10px 14px;border-radius:999px;
      background:rgba(184,155,86,.10);
      border:1px solid rgba(184,155,86,.30);
      color:#E7D7A2;font-weight:800;font-size:13px;white-space:nowrap
    }
    .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 6px rgba(184,155,86,.15)}
    .progress{padding:14px 24px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
    .progressTop{display:flex;justify-content:space-between;gap:12px;color:rgba(255,255,255,.65);font-size:13px;margin-bottom:10px;flex-wrap:wrap}
    .barBg{height:10px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
    .bar{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,var(--violet),var(--gold));box-shadow:0 0 18px rgba(130,77,235,.35)}
    .body{padding:22px 24px 10px}
    .q{font-weight:900;font-size:18px;line-height:1.25;margin:0 0 10px}
    .p{color:rgba(255,255,255,.76);font-size:14px;line-height:1.6;margin:0 0 16px}
    .choices{display:grid;grid-template-columns:1fr;gap:12px}
    @media(min-width:820px){.choices{grid-template-columns:1fr 1fr}}
    .btn{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      min-height:72px;
      padding:16px 14px;
      border-radius:16px;
      cursor:pointer;
      border:1px solid rgba(130,77,235,.55);
      background:rgba(130,77,235,.10);
      color:#fff;
      font-weight:900;
      font-size:15px;
      transition:.16s ease;
      user-select:none;
    }
    .btn:hover{transform:translateY(-1px);background:rgba(130,77,235,.18);border-color:rgba(130,77,235,.85)}
    .btn.gold{border-color:rgba(184,155,86,.55);background:rgba(184,155,86,.10)}
    .btn.gold:hover{background:rgba(184,155,86,.16);border-color:rgba(184,155,86,.85)}
    .btn .t{font-size:15px;font-weight:950}
    .btn .s{margin-top:6px;font-weight:700;opacity:.82;font-size:12.8px;line-height:1.45}
    .mini{margin-top:10px;color:rgba(255,255,255,.62);font-size:12.5px;line-height:1.5}
    .foot{padding:14px 24px 22px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
    .nav{
      min-height:46px;
      padding:10px 14px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.05);
      color:#fff;
      font-weight:900;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      text-align:center;
    }
    .nav.primary{
      border-color:rgba(130,77,235,.75);
      background:linear-gradient(180deg, rgba(130,77,235,.95), rgba(130,77,235,.72));
    }
    .nav:disabled{opacity:.45;cursor:not-allowed}
    .res{padding:18px 24px 22px;border-top:1px solid rgba(255,255,255,.08);display:none}
    .grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
    @media(min-width:820px){.grid{grid-template-columns:1fr 1fr}}
    .tile{border-radius:18px;padding:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.10)}
    .tile h3{margin:0 0 6px;font-weight:950;font-size:15px}
    .val{color:#E7D7A2;font-weight:950;font-size:28px;margin-top:2px}
    .acc{margin-top:14px;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.10)}
    .item{border-top:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.12)}
    .item:first-child{border-top:0}
    .accBtn{
      width:100%;
      padding:14px 16px;
      background:transparent;border:0;cursor:pointer;
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      color:#fff;font-weight:950;font-size:14px;
    }
    .accBtn span{color:#E7D7A2;font-weight:950}
    .panel{display:none;padding:0 16px 14px;color:rgba(255,255,255,.74);font-size:13.5px;line-height:1.6}
    .cta{
      width:100%;
      margin-top:14px;
      padding:14px 16px;
      border-radius:16px;
      border:1px solid rgba(130,77,235,.85);
      background:linear-gradient(180deg, rgba(130,77,235,1), rgba(130,77,235,.75));
      color:#fff;
      font-weight:950;
      text-align:center;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="app">
      <div class="head">
        <div>
          <h1>MarkSelling™ — Previsione Strategica del Reparto</h1>
          <div class="sub">4 step rapidi per costruire la tua architettura di crescita. Ogni risposta definisce l’investimento reale per eliminare attriti e stabilizzare il fatturato.</div>
        </div>
        <div class="badge"><span class="dot"></span> Dark Premium · Gold Accent</div>
      </div>

      <div class="progress">
        <div class="progressTop">
          <div id="stepTxt">Step 1/4</div>
          <div>Tempo stimato: 45s</div>
        </div>
        <div class="barBg"><div class="bar" id="bar"></div></div>
      </div>

      <div class="body" id="body"></div>

      <div class="foot">
        <button class="nav" id="back" type="button">Indietro</button>
        <button class="nav" id="restart" type="button">Ricomincia</button>
      </div>

      <div class="res" id="result"></div>
    </div>
  </div>

<script>
(function(){
  var body = document.getElementById('body');
  var bar  = document.getElementById('bar');
  var stepTxt = document.getElementById('stepTxt');
  var back = document.getElementById('back');
  var restart = document.getElementById('restart');
  var result = document.getElementById('result');

  var state = { marketing:null, setter:null, closer:null };
  var steps = [
    {
      key:'marketing',
      q:'Step 1 — Allineamento Marketing: chi ha la regia sulla vendita?',
      p:'Non stiamo “valutando le ads”. Stiamo definendo la regia unica (KPI, pipeline, messaggi, follow-up, scoring) che trasforma i lead in fatturato. Se hai già un team o un’agenzia, non la sostituiamo: la integriamo dentro un processo unico e misurabile.',
      choices:[
        {k:'marketing', v:'yes', label:'Attiva Marketing MarkSelling', style:'violet',
          s:'Regia completa: campagne, tracciamenti, ottimizzazioni in logica vendite, KPI unificati.'},
        {k:'marketing', v:'integrate', label:'No, ho già chi mi segue (team/agenzia)', style:'gold',
          s:'Integriamo KPI, CRM e flusso vendita per trasformare lead in fatturato senza cambiare fornitore.'}
      ]
    },
    {
      key:'setter',
      q:'Step 2 — Setter: quanta capacità di contatto ti serve?',
      p:'I Setter sono la prima linea anti-perdita: contatto entro 5 minuti, qualificazione, agenda piena di opportunità reali. Più velocità e metodo = più appuntamenti e meno sprechi.',
      choices:[
        {k:'setter', v:1, label:'1 Setter', style:'violet', s:'Per volumi controllati e processo stabile.'},
        {k:'setter', v:2, label:'2 Setter', style:'gold', s:'Per continuità, copertura e maggior spinta.'},
        {k:'setter', v:3, label:'3+ Setter', style:'violet', s:'Per crescita aggressiva e gestione massiva.'}
      ]
    },
    {
      key:'closer',
      q:'Step 3 — Closer: chi si prende la responsabilità della chiusura?',
      p:'Qui si decide il livello di responsabilità sul risultato. Se usi i tuoi commerciali, li allineiamo a script, pipeline e forecast. Se scegli i Closer MarkSelling, ci assumiamo la gestione diretta della trattativa fino alla firma (a provvigione).',
      choices:[
        {k:'closer', v:'internal', label:'Chiudono i miei commerciali interni', style:'gold',
          s:'Allineiamo script, pipeline, follow-up e forecast per rendere la chiusura prevedibile.'},
        {k:'closer', v:'ms1', label:'Voglio i Closer MarkSelling (a provvigione)', style:'violet',
          s:'Responsabilità totale sulla trattativa: dal primo appuntamento alla firma.'}
      ]
    },
    {
      key:'output',
      q:'Step 4 — Riepilogo investimento per la tua struttura di crescita',
      p:'Questa non è una “stima generica”: è la somma dei pezzi reali che attiviamo (team + sistemi + playbook) per far lavorare marketing e vendite come un unico organismo.',
      choices:[
        {k:'output', v:'go', label:'Mostrami il preventivo', style:'violet', s:'Conferma e genera la previsione economica.'}
      ]
    }
  ];

  var idx = 0;

  function money(n){
    return '€ ' + (Math.round(n*100)/100).toLocaleString('it-IT',{minimumFractionDigits:0, maximumFractionDigits:0});
  }

  function compute(){
    var setup = 0, monthly = 0;

    setup += 500;   // analisi processi
    setup += 1500;  // setup CRM

    if(state.marketing === 'yes'){
      setup += 800;     // setup marketing (account+tracking)
      monthly += 350;   // team marketing
    }

    monthly += 400; // direzione e PM sempre

    var sCount = (state.setter === 3) ? 3 : (state.setter || 1);
    setup += 700 * sCount;     // formazione setter
    monthly += 300 * sCount;   // fee setter

    var closerCount = (state.closer === 'ms1') ? 1 : 0;
    if(closerCount > 0){
      setup += 900; // formazione closer
    }

    return {setup:setup, monthly:monthly, sCount:sCount, closerCount:closerCount};
  }

  function render(){
    bar.style.width = Math.round(((idx+1)/steps.length)*100) + '%';
    stepTxt.textContent = 'Step ' + (idx+1) + '/' + steps.length;
    back.disabled = (idx === 0);

    var st = steps[idx];
    var html = '<div class="q">'+st.q+'</div><div class="p">'+st.p+'</div><div class="choices">';
    st.choices.forEach(function(c){
      var cls = 'btn' + (c.style==='gold' ? ' gold' : '');
      html += '<button type="button" class="'+cls+'" data-k="'+c.k+'" data-v="'+String(c.v)+'">' +
                '<div>' +
                  '<div class="t">'+c.label+'</div>' +
                  '<div class="s">'+c.s+'</div>' +
                '</div>' +
              '</button>';
    });
    html += '</div>';

    if(idx>0){
      html += '<div class="mini"><b>Scelte attuali:</b> ' +
              'Marketing: ' + (state.marketing ? (state.marketing==='yes'?'MarkSelling':'Integrazione') : '—') + ' · ' +
              'Setter: ' + (state.setter ? (state.setter===3?'3+':state.setter) : '—') + ' · ' +
              'Closer: ' + (state.closer ? (state.closer==='ms1'?'MarkSelling':'Interni') : '—') +
              '</div>';
    }

    body.innerHTML = html;

    Array.prototype.slice.call(body.querySelectorAll('button[data-k]')).forEach(function(btn){
      btn.addEventListener('click', function(){
        var k = btn.getAttribute('data-k');
        var v = btn.getAttribute('data-v');
        if(k==='setter') v = parseInt(v,10);
        state[k]=v;

        if(idx < steps.length-1){
          idx++;
          render();
        }else{
          showResult();
        }
      });
    });
  }

  function accordionSingle(container){
    var items = container.querySelectorAll('.item');
    items.forEach(function(item){
      var b = item.querySelector('.accBtn');
      var p = item.querySelector('.panel');
      b.addEventListener('click', function(){
        items.forEach(function(other){
          var op = other.querySelector('.panel');
          if(op) op.style.display='none';
        });
        p.style.display = (p.style.display==='block')?'none':'block';
      });
    });
    var first = container.querySelector('.panel');
    if(first) first.style.display='block';
  }

  function showResult(){
    var out = compute();
    body.innerHTML = '';
    result.style.display='block';

    var marketingLabel = (state.marketing==='yes') ? 'Attivo con MarkSelling' : 'Integrazione (team/agenzia esistente)';
    var setterLabel = (state.setter===3) ? '3+ (stimato 3)' : String(state.setter||1);
    var closerLabel = (state.closer==='ms1') ? 'Closer MarkSelling (a provvigione)' : 'Chiusura interna';

    result.innerHTML =
      '<div class="q">Il tuo investimento stimato (Setup + Fee mensile)</div>' +
      '<div class="p">Sotto trovi i numeri e <b>cosa include ogni voce</b>. È qui che si costruisce la previsione: team + sistemi + responsabilità.</div>' +
      '<div class="grid">' +
        '<div class="tile"><h3>Setup iniziale (una tantum)</h3><div class="val">'+money(out.setup)+'</div><div class="mini">Attivazione completa: processi, CRM, playbook e onboarding del team.</div></div>' +
        '<div class="tile"><h3>Fee mensile (fisso)</h3><div class="val">'+money(out.monthly)+'</div><div class="mini">Direzione + reparti operativi (marketing se incluso) + setter.</div></div>' +
      '</div>' +
      '<div class="mini" style="margin-top:12px;"><b>Configurazione scelta:</b> Marketing: '+marketingLabel+' · Setter: '+setterLabel+' · Closer: '+closerLabel+'</div>' +
      '<div class="acc" id="acc">' +

        '<div class="item">' +
          '<button class="accBtn" type="button">Setup iniziale — cosa include <span>'+money(out.setup)+'</span></button>' +
          '<div class="panel"><ul style="margin:10px 0 0 18px;padding:0">' +
            '<li><b>Audit processi & obiettivi</b> (mappiamo attriti, tempi morti e priorità commerciali).</li>' +
            '<li><b>Setup CRM & Pipeline anti-perdita</b> (stati, regole, responsabilità, tracciamento).</li>' +
            '<li><b>Automazioni & messaggistica</b> (follow-up, nurturing, tag e fit scoring).</li>' +
            '<li><b>Onboarding & Playbook</b> (script, checklist, standard “contatto entro 5 min”).</li>' +
            (state.marketing==='yes'
              ? '<li><b>Setup ADV & tracciamenti</b> (account, eventi, conversioni, ottimizzazione in logica vendite).</li>'
              : '<li><b>Integrazione con team/agenzia</b> (KPI condivisi, pipeline e regia unica senza sostituzione).</li>') +
            '<li><b>Formazione Setter</b> ('+out.sCount+' risorse) '+(out.closerCount?'+ <b>Formazione Closer</b>.':' + <b>Allineamento chiusura interna</b>.')+'</li>' +
          '</ul></div>' +
        '</div>' +

        '<div class="item">' +
          '<button class="accBtn" type="button">Fee mensile — cosa include <span>'+money(out.monthly)+'</span></button>' +
          '<div class="panel"><ul style="margin:10px 0 0 18px;padding:0">' +
            '<li><b>Direzione & PM</b> (forecast settimanale, KPI unificati, correzioni rapide).</li>' +
            (state.marketing==='yes'
              ? '<li><b>Reparto Marketing</b> (gestione campagne, ottimizzazione e KPI legati al fatturato).</li>'
              : '<li><b>Regia sull’ecosistema esistente</b> (allineamento marketing-vendite e KPI condivisi).</li>') +
            '<li><b>Setter</b> ('+out.sCount+') (presa appuntamenti, qualificazione, agenda pulita).</li>' +
          '</ul><div class="mini" style="margin-top:10px;">' +
            (state.closer==='ms1'
              ? '<b>Nota Closer:</b> la chiusura è a provvigione (si attiva sul fatturato generato).'
              : '<b>Nota:</b> se la chiusura è interna, allineiamo script, follow-up e pipeline per renderla prevedibile.') +
          '</div></div>' +
        '</div>' +

        '<div class="item">' +
          '<button class="accBtn" type="button">Cosa succede ora <span>Convalida</span></button>' +
          '<div class="panel"><p style="margin:10px 0 0">La convalida strategica serve a verificare i numeri sul tuo caso reale e finalizzare la configurazione migliore.</p>' +
          '<ul style="margin:10px 0 0 18px;padding:0">' +
            '<li>Validiamo obiettivo e capacità (marketing → setter → closer).</li>' +
            '<li>Definiamo pipeline, standard di contatto e KPI settimanali.</li>' +
            '<li>Impostiamo una roadmap di 30 giorni con responsabilità chiare.</li>' +
          '</ul></div>' +
        '</div>' +

      '</div>' +
      '<a class="cta" href="https://www.markselling.it/booking-audit/" target="_blank" rel="noopener">PRENOTA LA CONVALIDA STRATEGICA (DISCUTIAMO I NUMERI) →</a>' +
      '<div class="mini" style="margin-top:10px;">Consulenza gratuita, zero vincoli. Serve a confermare la configurazione e rendere i risultati prevedibili.</div>';

    accordionSingle(document.getElementById('acc'));
  }

  back.addEventListener('click', function(){
    if(idx>0){
      result.style.display='none';
      idx--;
      render();
    }
  });

  restart.addEventListener('click', function(){
    state.marketing=null; state.setter=null; state.closer=null;
    idx=0; result.style.display='none';
    render();
  });

  render();
})();
</script>
</body>
</html>
